# Point-in-time inputs required before any factor computation may run.
# Paths are local data locations only; no credentials belong in this file.
# URL templates are public NSE endpoints and may be changed if NSE moves them.
pit_prices_dir: data/pit/bhavcopy
announcement_index_path: data/pit/announcement_index.parquet
fundamentals_path: data/pit/fundamentals_announcements.parquet
membership_path: data/pit/membership.parquet

acquisition:
  start_date: 2005-01-01
  end_date: 2026-11-13
  udiff_start_date: 2024-07-01
  session_url: https://www.nseindia.com
  legacy_url_template: https://archives.nseindia.com/content/historical/EQUITIES/{year}/{month}/{filename}
  udiff_url_template: https://archives.nseindia.com/products/content/sec_bhavdata_full_{compact_date}.csv
  announcement_url_template: https://www.nseindia.com/api/corporate-announcements?index=equities&from_date={start}&to_date={end}
  announcement_raw_dir: data/pit/announcement_json
  filing_dir: data/pit/filings
  # Python weekday numbers: Monday=0 through Sunday=6.
  weekdays: [0, 1, 2, 3, 4]
  announcement_chunk_days: 30
  request_delay_seconds: 0.5
  timeout_seconds: 30
  retry_attempts: 3
  # Applied at data ingestion only; the frozen factor design is unchanged.
  exclude_symbol_pattern: "(?:BEES|ETF|INDEX)$"

# Best-effort text extraction from downloaded filings. Values are append-only
# and announcement-dated; unparsed PDFs are reported, never silently skipped.
fundamentals:
  crore_multiplier: 10000000
  label_value_max_chars: 120
  fields:
    trailing_12m_diluted_eps:
      unit: rupees
      labels:
        - 'Diluted\s+EPS'
        - 'Diluted\s+earnings\s+per\s+share'
    trailing_12m_net_profit:
      unit: crore
      labels:
        - 'Net\s+Profit'
        - 'Profit\s+after\s+tax'
        - '\bPAT\b'
    average_shareholders_equity:
      unit: crore
      labels:
        - 'Average\s+shareholders.?\s+equity'
        - 'Average\s+net\s+worth'
